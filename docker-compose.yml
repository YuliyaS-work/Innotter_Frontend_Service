version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: react_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src         
      - ./public:/app/public
    networks:
      - inner-net      

networks:
  inner-net:
    external: true